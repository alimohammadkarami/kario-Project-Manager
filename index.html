<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کاریو | مدیریت پروژه</title>

    <!-- Vazirmatn: Persian/Arabic typeface used across the app -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="icon" href="/public/favicon/favicon-kario.png">

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />

    <!-- Apply saved theme before paint to avoid a light/dark flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kario-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored ? stored === "dark" : prefersDark;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
